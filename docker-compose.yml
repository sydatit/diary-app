services:
  api:
    build:
      context: ./CranberryAPI
      dockerfile: Dockerfile
    image: cranberry-api:latest
    container_name: cranberry-api
    restart: unless-stopped
    env_file:
      - ./CranberryAPI/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # host:container — gọi từ Postman: http://<IP-public-Oracle>:8080
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./CranberryWeb
      dockerfile: Dockerfile
    image: cranberry-web:latest
    container_name: cranberry-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Frontend (nginx). /api/* được proxy sang service `api` trong cùng network.
      # Port 80 trên host đang bị dùng bởi project khác -> mặc định 3000.
      - "${WEB_PORT:-3000}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
