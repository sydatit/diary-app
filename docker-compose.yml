services:
  api:
    build:
      context: ./CranberryAPI
      dockerfile: Dockerfile
    image: cranberry-api:latest
    container_name: cranberry-api
    restart: unless-stopped
    depends_on:
      - transcriber
    env_file:
      - ./CranberryAPI/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # host:container — gọi từ Postman: http://<IP-public-Oracle>:8080
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Whisper chạy local (chép lời ghi âm nhật ký). Chỉ service `api` gọi tới, qua http://transcriber:8000.
  transcriber:
    build:
      context: ./transcriber
      args:
        # phowhisper-small (chuyên tiếng Việt) | small | base | medium ... Đổi thì phải build lại image.
        WHISPER_MODEL: ${WHISPER_MODEL:-phowhisper-small}
    image: cranberry-transcriber:latest
    container_name: cranberry-transcriber
    restart: unless-stopped
    environment:
      # Số CPU Whisper được dùng (0 = tất cả).
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./CranberryWeb
      dockerfile: Dockerfile
    image: cranberry-web:latest
    container_name: cranberry-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Frontend (nginx). /api/* được proxy sang service `api` trong cùng network.
      # Port 80 trên host đang bị dùng bởi project khác -> mặc định 3000.
      - "${WEB_PORT:-3000}:80"
    networks:
      default:
      # Mạng của Caddy (dự án elearning) đang giữ cổng 80/443 trên máy chủ.
      # Caddy trỏ unplug.datnguyen.site -> unplug-web:80.
      proxy:
        aliases:
          - unplug-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: ${PROXY_NETWORK:-elearning_default}
    external: true
